<!--
  文件摘要

  模块角色：utils/console/form 的样式资源，配合模板控制表单在游戏控制台中的外观。

  主要功能：设置字段与标签排列、深色输入和选择控件，以及提交按钮样式。

  实现过程：以 hopgoldy 类名匹配模板中的元素，用内联 style 标签随 createForm 的 HTML 一起输出。

  技术要点：固定样式不含占位符；部分规则用 !important 覆盖游戏页面的既有样式。
  构建插件压缩 CSS 并删除注释，样式随每次表单输出重复包含；它影响匹配的页面元素，不读写游戏存储。
-->
<style>
    .hopgoldy-field {
        margin-right: 16px;
        display: inline;
    }
    .hopgoldy-field span {
        font-weight: bold;
        color: #82a1d6
    }
    input.hopgoldy {
        background-color: #2b2b2b;
        border: none;
        border-bottom: 1px solid #888;
        padding: 3px;
        color: #ccc;
        margin-right: 0px !important;
    }
    select.hopgoldy {
        border: none;
        background-color: #2b2b2b;
        color: #ccc;
        margin-right: 0px !important;
    }
    button.hopgoldy {
        border: 1px solid #888;
        cursor: pointer;
        background-color: #2b2b2b;
        color: #ccc;
        margin: 0px 18px;
    }
</style>
