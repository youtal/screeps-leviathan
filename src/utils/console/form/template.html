<!--
  文件摘要：保存控制台表单及各类控件的 HTML 模板片段。
  createForm 依赖 `;;` 的固定顺序拆分片段，并用 `{占位符}` 注入数据；按钮脚本
  从 DOM 收集字段值后调用传入命令，checkbox 因可能多选而单独返回数组。

  模块位置：src/utils/console/form 的模板资源，由 createForm.ts 通过
  `import template from './template.html'` 导入，不做逻辑判断，也不含游戏状态。

  输入 / 输出：本文件是被动数据。createForm 在模块求值期用 split 把整段文本切成
  7 段（顺序：表单外层 / select / option / input / checkbox / radio / 表单项容器），
  再用 replaceHtml 把 `{占位符}` 替换成运行期内容，因此新增片段必须追加在末尾，
  否则会打乱既有定位。

  构建约定：Rollup 的 htmlString 插件在构建期用 html-minifier-terser 压缩本文件，
  `removeComments: true` 会删除所有 HTML 注释（包括本说明与下面各行注释中的
  分隔符字样），因此产物里的分隔符只出现在真实片段之间；`collapseWhitespace`
  负责去掉缩进，运行期再由 fixRetraction 折叠剩余换行。

  按钮脚本（表单外层片段内联）：
  - `{formName}` 同时用于 form 的 name 与脚本中的 document.forms 查询，二者必须一致；
  - `{elementNames}` 由 createForm 生成为 'a','b' 形式，外层方括号把它组成 JS 数组；
  - 同名控件多于一个时 `form[eleName]` 是 RadioNodeList，脚本用首元素的 type 判断
    是否为 checkbox：是则收集所有 checked 值成数组，否则直接取 value；
  - 数据对象经 JSON.stringify 后拼成 `({command})(数据)` 交给控制台 Console.sendCommand
    执行（第二个实参固定为 1，沿用社区示例的调用形式，参考链接见脚本内注释）。

  维护注意：输出会经过 fixRetraction 删除换行，因此 onclick 属性里的脚本不能使用
  `//` 行注释——折叠后它会把同一行后续代码全部注释掉；需要注释时请改用块注释。
-->
<!-- 表单外层模板 -->
<form name="{formName}">
    {formContent}
    <button
        class="hopgoldy"
        type="button"
        onclick="(() => {
            // 获取表单数据
            const form = document.forms['{formName}'];
            let formDatas = {};
            [{elementNames}].map(eleName => {
                // 如果是复选框的话需要特殊处理下
                if (form[eleName] instanceof RadioNodeList && form[eleName][0].type === 'checkbox') {
                    formDatas[eleName] = []
                    form[eleName].forEach(el => el.checked && formDatas[eleName].push(el.value))
                }
                else formDatas[eleName] = form[eleName].value;
            });

            // 将表单数据格式化为 JSON 对象在控制台发给指定的命令
            // @see https://screeps.slack.com/files/U5GS01HT8/FJGTY8VQE/console_button.php
            angular.element(document.body).injector().get('Console').sendCommand(
                `({command})(${JSON.stringify(formDatas)})`
            , 1);
        })()"
    >{buttonLabel}</button>
</form>

;;

<!-- 下拉框模板  -->
<select name="{name}" class="hopgoldy">{option}</select>

;;

<!-- 下拉框选项模板 -->
<option value="{value}">{label}</option>

;;

<!-- 输入框模板 -->
<input name="{name}" placeholder="{placeholder}" class="hopgoldy"/>

;;

<!-- 复选框模板 -->
<input type="checkbox" name="{name}" value="{value}" class="hopgoldy"> {label}</input>

;;

<!-- 单选框模板 -->
<input type="radio" name="{name}" value="{value}" class="hopgoldy"> {label}</input>

;;

<!-- 表单项容器 -->
<div class="hopgoldy-field">
    <span>{label}</span>
    {content}
</div>
