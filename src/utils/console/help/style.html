<!--
  文件摘要

  模块角色：utils/console/help 的样式资源，配合模板排列模块介绍与 API 说明。

  主要功能：设置模块标题、说明、可换行的 API 卡片和内容行，并控制详情折叠。

  实现过程：模块规则使用 flex 布局，API 规则隐藏 checkbox，并用相邻元素选择器和 :checked
  改变内容区域的最大高度，使点击 label 即可展开或收起。

  技术要点：不需要 JavaScript 来实现折叠；选择器依赖模板的类名与元素顺序。
  样式作为固定字符串随每次帮助 HTML 输出，构建时压缩 CSS 并删除注释，不读取游戏状态。
-->
<!-- 模块样式 -->
<style>
    .module-help {
        display: flex;
        flex-flow: column nowrap;
    }
    .module-container {
        padding: 0px 10px 10px 10px;
        display: flex;
        flex-flow: column nowrap;
    }
    .module-info {
        margin: 5px;
        display: flex;
        flex-flow: row nowrap;
        align-items: baseline;
    }
    .module-title {
        font-size: 19px;
        font-weight: bolder;
        margin-left: -15px;
        margin-right: 8px;
    }
    .module-api-list {
        display: flex;
        flex-flow: row wrap;
    }
</style>

<!--
  api 样式：折叠交互由 input + label + 相邻兄弟选择器完成。
  - label 的 for 与 input 的 id 由 createHelp 生成并保持一致，点击标题即切换选中态；
  - max-height 过渡而非 display 切换，避免展开时重排抖动；
  - 展开内容使用 overflow-x: auto，容纳较长的调用示例。
-->
<style>
    .api-content-line {
        width: max-content;
        padding-right: 15px;
    }
    .api-container {
        margin: 5px;
        width: 250px;
        background-color: #2b2b2b;
        overflow: hidden;
        display: flex;
        flex-flow: column;
    }

    .api-container label {
        transition: all 0.1s;
        min-width: 300px;
    }
    
    /* 隐藏input */
    .api-container input {
        display: none;
    }
    
    .api-container label {
        cursor: pointer;
        display: block;
        padding: 10px;
        background-color: #3b3b3b;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    
    .api-container label:hover, label:focus {
        background-color: #525252;
    }
    
    /* 清除所有展开的子菜单的 display */
    .api-container input + .api-content {
        overflow: hidden;
        transition: all 0.1s;
        width: auto;
        max-height: 0px;
        padding: 0px 10px;
    }
    
    /* 当 input 被选中时，给所有展开的子菜单设置样式 */
    .api-container input:checked + .api-content {
        max-height: 200px;
        padding: 10px;
        background-color: #1c1c1c;
        overflow-x: auto;
    }
</style>
